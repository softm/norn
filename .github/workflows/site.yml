name: NORN checks and Pages preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: norn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum
      - run: python -m pip install -r requirements.txt
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/ui-live.py ui-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-verification
          path: ui-results
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Package local engine and website (source only)
        run: git archive --format=zip HEAD -o norn-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: norn-source
          path: norn-source.zip
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts
      - run: npm run test:rules
      - name: Record dependency audit
        run: npm audit --json > npm-audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: npm-audit.json
  deploy-pages:
    needs: [check, firestore-rules]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages setup without requesting extra privileges
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const settings = `https://github.com/${context.repo.owner}/${context.repo.repo}/settings/pages`;
            let ready = false;
            try {
              const result = await github.rest.repos.getPages(context.repo);
              ready = result.data.build_type === 'workflow';
            } catch (error) {
              if (![403, 404].includes(error.status)) throw error;
            }
            core.setOutput('ready', String(ready));
            if (!ready) {
              core.notice('Pages deployment NOT performed: choose GitHub Actions in repository Settings > Pages.');
              await core.summary.addHeading('Pages setup required · not deployed')
                .addRaw('Code and rule checks are separate from deployment. The workflow token cannot enable a new Pages site.\n')
                .addLink('Open Pages settings', settings).write();
            }
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.ready == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.pages.outputs.ready == 'true'
        id: deployment
